<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const roles = ['주연배우', '조연배우', '주연배우', '우정출연', '우정출연', '조연배우']
    const names = ['홍길동', '이춘향', '금나래', '장보고', '임꺽정', '강감찬']
    
    let length = 0;
    for (const role of roles){
      length++
    }

    let num = 0

    // function curculation()
    while (num < length){
      const role = roles[num];
      const name = names[num];
      if (role === '주연배우'){
        console.log(`주연배우 : ${name}님 반갑습니다!`)
      }
      else if (role === '조연배우'){
        console.log(`${name}님 환영합니다!`)
      }
      else if (role === '우정출연'){
        console.log(`${name}님 와 주셔서 감사합니다!`)
      }
      num++;
    }



  </script>
</body>
</html>
