<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .bg-color {
      background-color: #f0f0f0;
      padding: 20px;
      margin: 20px;
    }

    .fs-2 {
      font-size: 2rem;
    }
  </style>
</head>

<body>
  <div>
    <h2>Input</h2>
    <input type="text" class="text-input">
    <span class="warning" style="color: red; display: none;">글자 수를 초과하였습니다.</span>
    <p></p>
  </div>
  <div>
    <h2>Color</h2>
    <input type="text" class="color-input">
  </div>

  <script>
    // 아래에 코드 작성
    

  const textInput = document.querySelector('.text-input')
  const colorInput = document.querySelector('.color-input') // 아래에 있던 걸 위로 모아두면 보기 편해요!
  const pEl = document.querySelector('p')
  const warningSpan = document.querySelector('.warning')

  
  textInput.addEventListener('input', function(event) {
  
    const currentText = event.target.value
    
    
    pEl.textContent = currentText

   
    if (currentText.length > 5) {
      warningSpan.style.display = 'inline'
      pEl.style.display = 'none'
    } else {
      warningSpan.style.display = 'none'
      pEl.style.display = 'block' 
    }
  })

  textInput.addEventListener('focus', function() {
    pEl.classList.add('fs-2', 'bg-color')
  })

  textInput.addEventListener('blur', function() {
    pEl.classList.remove('fs-2', 'bg-color')
  })

  colorInput.addEventListener('input', function(event) {
    pEl.style.color = event.target.value 
  })

  </script>
</body>

</html>
