<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      height: 150px;
    }
  </style>
</head>
<body>
  <h1>Dog API</h1>
  <img draggable="false" src="noResult.png" alt="dog">
  <h2>아직 선택된 사진이 없습니다!</h2>
  <br>
  <button>Get dog</button>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API_URI = 'https://dog.ceo/api/breeds/image/random'

    //  수정할 img 태그와 h2 태그를 선택하여 변수에 할당한다.
    const imgTag = document.querySelector('img')
    const h2Tag = document.querySelector('h2')
    // button이 클릭되면 axios 함수가 실행되어야 한다.
    
    
    // button 태그를 선택하여 변수에 할당한다.
    const button = document.querySelector('button')
    
    // click 이벤트가 발생하면 axios 함수를 실행시킨다.
    button.addEventListener('click', getDog)
    // axios
    // axios CDN을 작성한다.
    function getDog () {
      axios({
        method: 'get',
        url: API_URI
      }).then((response) => {
        console.log(response.data.message)
        imgTag.src = response.data.message
        if (h2Tag){
          h2Tag.remove()
        }
      })
    }
    
    // dog API에 GET 요청을 보낸다.
    // 성공적으로 응답을 받았다면, img 태그의 src를 얻은 새 url로 변경한다.
    // h2 태그는 삭제한다.

  </script>
</body>
</html>
